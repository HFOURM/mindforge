<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    
    <link href="./dist/output.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-white min-h-screen flex flex-col text-gray-900 antialiased font-sans">
    
    <header class="w-full flex justify-between items-center px-8 py-6">
        <div class="text-xl font-bold">
            Mindforge
        </div>
        <div class="text-gray-500">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20"/>
            </svg>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-10 w-full max-w-sm mx-auto text-center">
          
        <h1 class="text-3xl md:text-4xl text-gray-900 mb-4 font-normal whitespace-nowrap">
            Sign Up Your Account
        </h1>
        <p class="text-gray-800 mb-8">
            Sign Up to continue:
        </p>

        <form id="registerForm" class="w-full mb-8">
            <div class="space-y-4">
                <input 
                    id="regName"
                    type="text" 
                    placeholder="Enter Your Full Name" 
                    class="w-full border border-gray-300 rounded-full py-3.5 px-6 text-[15px] outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 transition placeholder-gray-400"
                    required
                >
                
                <input 
                    id="regEmail"
                    type="email" 
                    placeholder="Enter Your Email Address" 
                    class="w-full border border-gray-300 rounded-full py-3.5 px-6 text-[15px] outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 transition placeholder-gray-400"
                    required
                >
                
                <input
                    id="regPassword"     
                    type="password" 
                    placeholder="Enter Password" 
                    class="w-full border border-gray-300 rounded-full py-3.5 px-6 text-[15px] outline-none focus:border-gray-500 focus:ring-1 focus:ring-gray-500 transition placeholder-gray-400"
                    required
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-black text-white  rounded-full py-3.5 mt-6 text-[15px] font-medium hover:bg-gray-800 transition shadow-sm">
                Sign Up
            </button>
        </form>

        <p class="text-gray-600 text-[15px] mb-12">
            Already have an account? <a href="login.html" class="underline text-gray-900">Log In Here</a>
        </p>

    </main>

    <footer class="w-full flex flex-col items-center pb-8">

        <div class="flex gap-6 text-[14px] text-gray-500">
            <span>© 2026</span>
            <a href="#" class="hover:text-gray-900 transition">Privacy</a>
            <a href="#" class="hover:text-gray-900 transition">Terms</a>
        </div>
    </footer>

</body>
<script src="form.js"></script>
</html>
