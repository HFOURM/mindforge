<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Mindforge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex flex-col text-gray-900 antialiased font-sans">

    <header class="w-full flex justify-between items-center px-8 py-6">
        <div class="text-xl font-bold">Mindforge</div>
        <div class="text-gray-400">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20"/>
            </svg>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 min-h-[80vh]">
        <div class="w-full max-w-[340px] flex flex-col items-center text-center">
            <h1 class="text-[28px] font-normal text-gray-900 mb-2 leading-tight">Sign Up Your Account</h1>
            <p class="text-gray-500 text-[14px] mb-8">Sign up to continue:</p>

            <form id="signupForm" class="w-full space-y-3 mb-6">
                <input type="text" id="signupName" placeholder="Enter your full name"
                    class="w-full px-5 py-3.5 border border-gray-200 rounded-full text-[14px] text-gray-700 focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400" required>
                <input type="email" id="signupEmail" placeholder="Enter your email"
                    class="w-full px-5 py-3.5 border border-gray-200 rounded-full text-[14px] text-gray-700 focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400" required>
                <input type="password" id="signupPassword" placeholder="Enter password"
                    class="w-full px-5 py-3.5 border border-gray-200 rounded-full text-[14px] text-gray-700 focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400" required>
                <button type="submit"
                    class="w-full bg-black text-white font-semibold py-3.5 rounded-full hover:bg-gray-800 transition text-[14px] mt-1">
                    Sign Up
                </button>
            </form>

            <p class="text-gray-500 text-[13px] mb-10">
                Already have an account? <a href="index.html" class="underline text-gray-900 font-medium">Log In Here</a>
            </p>
            <div class="flex gap-2 items-center">
                <div class="w-2.5 h-2.5 rounded-full bg-gray-200"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-gray-800"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-gray-200"></div>
            </div>
        </div>
    </main>

    <footer class="w-full flex justify-center pb-8">
        <div class="flex gap-6 text-[13px] text-gray-400">
            <span>© 2026</span>
            <a href="#" class="hover:text-gray-900 transition">Privacy</a>
            <a href="#" class="hover:text-gray-900 transition">Terms</a>
        </div>
    </footer>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            const users = JSON.parse(localStorage.getItem('mindforge_users') || '[]');
            const sudahAda = users.find(u => u.email === email);
            if (sudahAda) {
                alert('Email sudah terdaftar, gunakan email lain atau Log In');
            } else {
                users.push({ name, email, password });
                localStorage.setItem('mindforge_users', JSON.stringify(users));
                window.location.href = 'verify.html';
            }
        });
    </script>

</body>
<script src="form.js"></script>
</html>
