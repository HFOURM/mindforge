<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mindforge – Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/global.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; min-height: 100vh; background: #fff; font-family: 'Inter', sans-serif; }

        aside {
            width: 256px;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            background: #fff;
            border-right: 1px solid #E5E7EB;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            z-index: 50;
        }
        .sidebar-top { display: flex; flex-direction: column; gap: 24px; }
        .sidebar-logo { font-size: 20px; font-weight: 600; color: #191919; padding-left: 12px; }
        nav { display: flex; flex-direction: column; gap: 16px; }
        .nav-section-title { font-size: 14px; font-weight: 600; color: #191919; padding-left: 12px; margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center;
            padding: 8px 12px; border-radius: 8px;
            color: #191919; text-decoration: none;
            font-size: 15px; font-weight: 500;
            margin-bottom: 2px; transition: background 0.15s;
        }
        .nav-link:hover { background: #e8e8e8; }
        .nav-link.active { background: #e8e8e8; }
        .nav-link img { width: 20px; height: 20px; margin-right: 12px; }

        main {
            margin-left: 256px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-height: 100vh;
            padding-left: 0;
        }

        #navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 40;
            background: #FBFBFB;
        }

        .calendar-content { padding: 24px 0 24px 0; display: flex; flex-direction: column; gap: 0; flex: 1; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 24px; }
        .calendar-title { font-size: 32px; font-weight: 700; color: #191919; }
        .nav-buttons { display: flex; align-items: center; gap: 8px; }
        .nav-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: #e8e8e8; }
        .today-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 16px;
            font-size: 14px; font-weight: 500; color: #191919;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .today-btn:hover { background: #e8e8e8; }

        .calendar-grid-wrapper {
            background: #fff;
            border: 1px solid #E0E0E0;
            overflow: hidden;
            margin: 0 24px;
        }
        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border-bottom: 1px solid #E0E0E0;
        }
        .day-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #959595;
        }
        #calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        .cal-cell {
            min-height: 110px;
            border-bottom: 1px solid #E0E0E0;
            border-right: 1px solid #E0E0E0;
            padding: 12px;
            cursor: pointer;
        }
        .cal-cell:hover { background: #fafafa; }
        .cal-cell:nth-child(7n) { border-right: none; }
        .day-num {
            font-size: 13px;
            font-weight: 500;
            color: #474747;
            display: inline-block;
        }
        .day-num.other-month { color: #b8b8b8; }
        .day-num.today {
            width: 28px; height: 28px;
            background: #191919; color: #fff;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px;
        }
        .event-badge {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #191919;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Color variants for event badges */
        .event-badge.color-blue   { background: #2563EB; }
        .event-badge.color-green  { background: #16A34A; }
        .event-badge.color-red    { background: #DC2626; }
        .event-badge.color-purple { background: #7C3AED; }
        .event-badge.color-orange { background: #EA580C; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.2); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; padding: 14px;
            width: 280px; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; gap: 6px;
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .modal-title { font-size: 14px; font-weight: 600; color: #191919; }
        .modal-close { background: none; border: none; cursor: pointer; color: #959595; font-size: 18px; line-height: 1; padding: 2px 5px; border-radius: 5px; }
        .modal-close:hover { background: #e8e8e8; }
        .modal-input { width: 100%; border: 1.5px solid #191919; border-radius: 7px; padding: 6px 10px; font-size: 12px; font-family: Inter, sans-serif; color: #191919; outline: none; }
        .modal-input:focus { border-color: #191919; box-shadow: 0 0 0 2px rgba(25,25,25,0.08); }
        .modal-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; cursor: pointer; }
        .modal-row:hover { background: #f5f5f5; }
        .modal-time-row { display: flex; align-items: center; gap: 4px; width: 100%; overflow: hidden; }
        .modal-time { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; flex: 1; min-width: 0; overflow: hidden; }
        .modal-time input[type=time] { border: none; outline: none; font-size: 11px; font-family: Inter, sans-serif; color: #191919; background: transparent; width: 100%; min-width: 0; }
        .modal-allday { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; cursor: pointer; }
        .modal-allday input[type=checkbox] { width: 14px; height: 14px; accent-color: #191919; cursor: pointer; }

        /* Color picker */
        .color-picker-row { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px; }
        .color-picker-label { font-size: 12px; color: #191919; margin-right: 4px; }
        .color-dot {
            width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s;
        }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.selected { border-color: #191919; }
        .color-dot[data-color="default"] { background: #191919; }
        .color-dot[data-color="blue"]    { background: #2563EB; }
        .color-dot[data-color="green"]   { background: #16A34A; }
        .color-dot[data-color="red"]     { background: #DC2626; }
        .color-dot[data-color="purple"]  { background: #7C3AED; }
        .color-dot[data-color="orange"]  { background: #EA580C; }

        /* Description textarea */
        .modal-textarea {
            width: 100%; border: 1px solid #E0E0E0; border-radius: 7px;
            padding: 6px 10px; font-size: 12px; font-family: Inter, sans-serif;
            color: #191919; outline: none; resize: none; min-height: 56px;
        }
        .modal-textarea:focus { border-color: #191919; }

        .modal-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }
        .btn-cancel { padding: 5px 12px; border: 1px solid #E0E0E0; border-radius: 7px; background: #fff; font-size: 12px; font-weight: 500; color: #191919; cursor: pointer; font-family: Inter, sans-serif; }
        .btn-cancel:hover { background: #f5f5f5; }
        .btn-save { padding: 5px 12px; border: none; border-radius: 7px; background: #191919; font-size: 12px; font-weight: 500; color: #fff; cursor: pointer; font-family: Inter, sans-serif; }
        .btn-save:hover { opacity: 0.85; }

        /* Delete event item */
        .delete-event-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px;
            font-size: 12px; color: #191919; gap: 8px;
        }
        .delete-event-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-delete-event {
            padding: 3px 10px; border: none; border-radius: 6px;
            background: #DC2626; color: #fff; font-size: 11px; font-weight: 500;
            cursor: pointer; font-family: Inter, sans-serif; white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-delete-event:hover { background: #b91c1c; }

        /* Error shake */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .shake { animation: shake 0.25s ease; }
    </style>
</head>

    <!-- Delete Event Modal -->

            <div class="modal-footer" style="margin-top:4px;">

            </div>
        </div>

    <script>
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const dayNames   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const shortMonths= ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        //today 
        const TODAY = new Date();
        TODAY.setHours(0,0,0,0);

        //rvents store: { "YYYY-MM-DD": [{name, color}, ...] } 
        const events = {};

        let currentYear  = TODAY.getFullYear();
        let currentMonth = TODAY.getMonth();

        //render calender
        function renderCalendar(year, month) {
            document.getElementById("calendarTitle").textContent =
                `${monthNames[month]}  ${year}`;

            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const firstDay       = new Date(year, month, 1).getDay();
            const daysInMonth    = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth= new Date(year, month, 0).getDate();

            for (let i = 0; i < 42; i++) {
                const cell = document.createElement("div");
                cell.className = "cal-cell";

                let dayNum, isThisMonth = true;
                if (i < firstDay) {
                    dayNum = daysInPrevMonth - firstDay + i + 1;
                    isThisMonth = false;
                } else if (i >= firstDay + daysInMonth) {
                    dayNum = i - firstDay - daysInMonth + 1;
                    isThisMonth = false;
                } else {
                    dayNum = i - firstDay + 1;
                }

                const daySpan = document.createElement("span");
                daySpan.textContent = dayNum;
                daySpan.className = "day-num";

                if (!isThisMonth) {
                    daySpan.classList.add("other-month");
                } else {
                    //ompare against today ──
                    const cellDate = new Date(year, month, dayNum);
                    cellDate.setHours(0,0,0,0);
                    if (cellDate.getTime() === TODAY.getTime()) {
                        daySpan.classList.add("today");
                    }
                }

                cell.appendChild(daySpan);

                if (isThisMonth) {
                    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;

                    if (events[key]) {
                        events[key].forEach((ev, idx) => {
                            const badge = document.createElement("span");
                            badge.className = "event-badge" +
                                (ev.color && ev.color !== "default" ? ` color-${ev.color}` : "");
                            badge.textContent = ev.name;
                            (function(k, i) {
                                badge.addEventListener("click", function(e) {
                                    e.stopPropagation();
                                    openDeleteModal(k, i);
                                });
                            })(key, idx);
                            cell.appendChild(badge);
                        });
                    }

                    //click cell to open new event 
                    (function(y, m, d, k) {
                        cell.addEventListener("click", function() {
                            openModal(y, m, d, k);
                        });
                    })(year, month, dayNum, key);
                }

                grid.appendChild(cell);
            }
        }

        //modal state
        let activeKey = null;
        let selectedColor = "default";

        function openModal(y, m, d, key) {
            activeKey = key;
            selectedColor = "default";

            const date = new Date(y, m, d);
            document.getElementById("modalDateText").textContent =
                dayNames[date.getDay()] + ", " + shortMonths[m] + " " + d + ", " + y;

            document.getElementById("eventName").value = "";
            document.getElementById("startTime").value = "09:30";
            document.getElementById("endTime").value   = "11:30";
            document.getElementById("allDayCheck").checked = false;
            document.getElementById("timeRow").style.display = "";
            document.getElementById("guestsInput").style.display = "none";
            document.getElementById("descInput").style.display   = "none";
            document.getElementById("descInput").value  = "";
            document.getElementById("guestsInput").value = "";

            // Reset color dots
            document.querySelectorAll(".color-dot").forEach(dot => {
                dot.classList.toggle("selected", dot.dataset.color === "default");
            });

            document.getElementById("eventModal").classList.add("active");
            setTimeout(() => document.getElementById("eventName").focus(), 50);
        }

        function closeModal() {
            document.getElementById("eventModal").classList.remove("active");
            activeKey = null;
        }

        //color picker 
        document.querySelectorAll(".color-dot").forEach(dot => {
            dot.addEventListener("click", function() {
                selectedColor = this.dataset.color;
                document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("selected"));
                this.classList.add("selected");
            });
        });

        //toggle all day 
        document.getElementById("allDayCheck").addEventListener("change", function() {
            document.getElementById("timeRow").style.display = this.checked ? "none" : "";
        });

        //toggle guests
        document.getElementById("addGuestsRow").addEventListener("click", function() {
            const inp = document.getElementById("guestsInput");
            const show = inp.style.display === "none";
            inp.style.display = show ? "" : "none";
            if (show) inp.focus();
        });

        //toggle desc
        document.getElementById("descRow").addEventListener("click", function() {
            const ta = document.getElementById("descInput");
            const show = ta.style.display === "none";
            ta.style.display = show ? "" : "none";
            if (show) ta.focus();
        });

        //save event
        document.getElementById("saveEvent").addEventListener("click", function() {
            const nameInput = document.getElementById("eventName");
            const name = nameInput.value.trim();

            if (!name) {
                nameInput.classList.remove("shake");
                void nameInput.offsetWidth; 
                nameInput.classList.add("shake");
                nameInput.focus();
                return;
            }

            if (!events[activeKey]) events[activeKey] = [];
            events[activeKey].push({ name, color: selectedColor });

            closeModal();
            renderCalendar(currentYear, currentMonth);
        });

        //nav controls 
        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("todayBtn").addEventListener("click", () => {
            currentYear  = TODAY.getFullYear();
            currentMonth = TODAY.getMonth();
            renderCalendar(currentYear, currentMonth);
        });

        // ── Close new-event modal ─────────────────────────────────────
        document.getElementById("closeModal").addEventListener("click", closeModal);
        document.getElementById("cancelModal").addEventListener("click", closeModal);
        document.getElementById("eventModal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") { closeModal(); closeDeleteModal(); }
        });

        //delete modal
        let deleteKey = null;

        function openDeleteModal(key) {
            deleteKey = key;
            const evList = events[key] || [];

            const parts = key.split("-");
            const d = new Date(+parts[0], +parts[1]-1, +parts[2]);
            document.getElementById("deleteModalTitle").textContent =
                dayNames[d.getDay()] + ", " + shortMonths[d.getMonth()] + " " + d.getDate();

            renderDeleteList();
            document.getElementById("deleteModal").classList.add("active");
        }

        function renderDeleteList() {
            const list = document.getElementById("deleteEventList");
            list.innerHTML = "";
            const evList = events[deleteKey] || [];

            if (evList.length === 0) {
                list.innerHTML = `<div style="font-size:12px;color:#959595;padding:6px 10px;">No events on this day.</div>`;
                return;
            }

            evList.forEach((ev, idx) => {
                const item = document.createElement("div");
                item.className = "delete-event-item";

                const dot = document.createElement("span");
                dot.style.cssText = `width:10px;height:10px;border-radius:50%;flex-shrink:0;background:${
                    ev.color === "blue" ? "#2563EB" :
                    ev.color === "green" ? "#16A34A" :
                    ev.color === "red" ? "#DC2626" :
                    ev.color === "purple" ? "#7C3AED" :
                    ev.color === "orange" ? "#EA580C" : "#191919"
                }`;

                const name = document.createElement("span");
                name.className = "delete-event-name";
                name.textContent = ev.name;

                const btn = document.createElement("button");
                btn.className = "btn-delete-event";
                btn.textContent = "Delete";
                (function(i) {
                    btn.addEventListener("click", function() {
                        events[deleteKey].splice(i, 1);
                        if (events[deleteKey].length === 0) delete events[deleteKey];
                        renderCalendar(currentYear, currentMonth);
                        if (!events[deleteKey] || events[deleteKey].length === 0) {
                            closeDeleteModal();
                        } else {
                            renderDeleteList();
                        }
                    });
                })(idx);

                item.appendChild(dot);
                item.appendChild(name);
                item.appendChild(btn);
                list.appendChild(item);
            });
        }

        function closeDeleteModal() {
            document.getElementById("deleteModal").classList.remove("active");
            deleteKey = null;
        }

        document.getElementById("closeDeleteModal").addEventListener("click", closeDeleteModal);
        document.getElementById("cancelDeleteModal").addEventListener("click", closeDeleteModal);
        document.getElementById("deleteModal").addEventListener("click", function(e) {
            if (e.target === this) closeDeleteModal();
        });

        //initial render
        renderCalendar(currentYear, currentMonth);
    </script>

</body>
</html>
