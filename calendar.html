<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mindforge – Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/global.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; min-height: 100vh; background: #fff; font-family: 'Inter', sans-serif; }

        aside {
            width: 256px;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            background: #fff;
            border-right: 1px solid #E5E7EB;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            z-index: 50;
        }
        .sidebar-top { display: flex; flex-direction: column; gap: 24px; }
        .sidebar-logo { font-size: 20px; font-weight: 600; color: #191919; padding-left: 12px; }
        nav { display: flex; flex-direction: column; gap: 16px; }
        .nav-section-title { font-size: 14px; font-weight: 600; color: #191919; padding-left: 12px; margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center;
            padding: 8px 12px; border-radius: 8px;
            color: #191919; text-decoration: none;
            font-size: 15px; font-weight: 500;
            margin-bottom: 2px; transition: background 0.15s;
        }
        .nav-link:hover { background: #e8e8e8; }
        .nav-link.active { background: #e8e8e8; }
        .nav-link img { width: 20px; height: 20px; margin-right: 12px; }

        main {
            margin-left: 256px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #FBFBFB;
            min-height: 100vh;
        }

        #navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 40;
            background: #FBFBFB;
        }
        .search-box {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid #E0E0E0; border-radius: 8px;
            padding: 8px 12px;
        }
        .search-box input { border: none; outline: none; background: transparent; font-size: 14px; color: #828282; }
        .btn-create {
            background: #191919; color: #fff;
            border: none; border-radius: 8px;
            padding: 8px 14px; font-size: 14px; font-weight: 500;
            cursor: pointer;
        }

        .calendar-content { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; }
        .calendar-title { font-size: 32px; font-weight: 700; color: #191919; }
        .nav-buttons { display: flex; align-items: center; gap: 8px; }
        .nav-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: #e8e8e8; }
        .today-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 16px;
            font-size: 14px; font-weight: 500; color: #191919;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .today-btn:hover { background: #e8e8e8; }

        .calendar-grid-wrapper {
            background: #fff;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            overflow: hidden;
        }
        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border-bottom: 1px solid #E0E0E0;
        }
        .day-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #959595;
        }
        #calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        .cal-cell {
            min-height: 110px;
            border-bottom: 1px solid #E0E0E0;
            border-right: 1px solid #E0E0E0;
            padding: 12px;
            overflow: hidden;
        }
        .cal-cell:nth-child(7n) { border-right: none; }
        .day-num {
            font-size: 13px;
            font-weight: 500;
            color: #474747;
            display: inline-block;
        }
        .day-num.other-month { color: #b8b8b8; }
        .day-num.today {
            width: 28px; height: 28px;
            background: #191919; color: #fff;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px;
        }
        .event-badge {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #e8e8e8;
            color: #191919;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

    <aside>
        <div class="sidebar-top">
            <div class="sidebar-logo">Mindforge</div>
            <nav>
                <div>
                    <div class="nav-section-title">Overview</div>
                    <a href="index.html" class="nav-link">
                        <img src="assets/icons/home.png" /> Dashboard
                    </a>
                    <a href="tasks.html" class="nav-link">
                        <img src="assets/icons/list.png" /> My Tasks
                    </a>
                </div>
                <div>
                    <div class="nav-section-title">Workspace</div>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Folder.png" /> Projects
                    </a>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Pin.png" /> Events
                    </a>
                    <a href="calendar.html" class="nav-link active">
                        <img src="assets/icons/Date_today.png" /> Calendar
                    </a>
                </div>
                <div>
                    <div class="nav-section-title">Insight</div>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Frame 4.png" /> Analytics
                    </a>
                </div>
            </nav>
        </div>
        <div>
            <a href="#" class="nav-link">
                <img src="assets/icons/Setting_line.png" /> Settings
            </a>
        </div>
    </aside>

    <main>
        <div id="navbar">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="#828282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M21 21L16.65 16.65" stroke="#828282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input type="text" placeholder="Search...">
            </div>
            <button class="btn-create">Create Task</button>
        </div>

        <div class="calendar-content">
            <div class="calendar-header">
                <h1 class="calendar-title" id="calendarTitle"></h1>
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M15 18L9 12L15 6" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="today-btn" id="todayBtn">Today</button>
                    <button class="nav-btn" id="nextMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="day-headers">
                    <div class="day-header">Sun</div>
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                </div>
                <div id="calendarGrid"></div>
            </div>
        </div>
    </main>

    <script>
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

        const events = {
            "2026-08-03": ["Primary Button"],
            "2026-08-12": ["Today"],
        };

        let currentYear = 2026;
        let currentMonth = 7; // August

        function renderCalendar(year, month) {
            document.getElementById("calendarTitle").textContent = `${monthNames[month]}  ${year}`;
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const isCurrentMonth = year === 2026 && month === 7;

            for (let i = 0; i < 42; i++) {
                const cell = document.createElement("div");
                cell.className = "cal-cell";

                let dayNum, isThisMonth = true;
                if (i < firstDay) {
                    dayNum = daysInPrevMonth - firstDay + i + 1;
                    isThisMonth = false;
                } else if (i >= firstDay + daysInMonth) {
                    dayNum = i - firstDay - daysInMonth + 1;
                    isThisMonth = false;
                } else {
                    dayNum = i - firstDay + 1;
                }

                const daySpan = document.createElement("span");
                daySpan.textContent = dayNum;
                daySpan.className = "day-num";

                if (!isThisMonth) {
                    daySpan.classList.add("other-month");
                } else if (isCurrentMonth && dayNum === 12) {
                    daySpan.classList.add("today");
                }

                cell.appendChild(daySpan);

                if (isThisMonth) {
                    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                    if (events[key]) {
                        events[key].forEach(e => {
                            const badge = document.createElement("span");
                            badge.className = "event-badge";
                            badge.textContent = e;
                            cell.appendChild(badge);
                        });
                    }
                }

                grid.appendChild(cell);
            }
        }

        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("todayBtn").addEventListener("click", () => {
            currentYear = 2026; currentMonth = 7;
            renderCalendar(currentYear, currentMonth);
        });

        renderCalendar(currentYear, currentMonth);
    </script>

</body>
</html>
