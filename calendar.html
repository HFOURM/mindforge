<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mindforge – Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/global.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { display: flex; min-height: 100vh; background: #fff; font-family: 'Inter', sans-serif; }

        aside {
            width: 256px;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            background: #fff;
            border-right: 1px solid #E5E7EB;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 12px;
            z-index: 50;
        }
        .sidebar-top { display: flex; flex-direction: column; gap: 24px; }
        .sidebar-logo { font-size: 20px; font-weight: 600; color: #191919; padding-left: 12px; }
        nav { display: flex; flex-direction: column; gap: 16px; }
        .nav-section-title { font-size: 14px; font-weight: 600; color: #191919; padding-left: 12px; margin-bottom: 4px; }
        .nav-link {
            display: flex; align-items: center;
            padding: 8px 12px; border-radius: 8px;
            color: #191919; text-decoration: none;
            font-size: 15px; font-weight: 500;
            margin-bottom: 2px; transition: background 0.15s;
        }
        .nav-link:hover { background: #e8e8e8; }
        .nav-link.active { background: #e8e8e8; }
        .nav-link img { width: 20px; height: 20px; margin-right: 12px; }

        main {
            margin-left: 256px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-height: 100vh;
            padding-left: 0;
        }

        #navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 40;
            background: #FBFBFB;
        }

        .calendar-content { padding: 24px 0 24px 0; display: flex; flex-direction: column; gap: 0; flex: 1; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .calendar-title { font-size: 32px; font-weight: 700; color: #191919; }
        .nav-buttons { display: flex; align-items: center; gap: 8px; }
        .nav-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: #e8e8e8; }
        .today-btn {
            border: 1px solid #E0E0E0; background: #fff;
            border-radius: 8px; padding: 8px 16px;
            font-size: 14px; font-weight: 500; color: #191919;
            cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .today-btn:hover { background: #e8e8e8; }

        .calendar-grid-wrapper {
            background: #fff;
            border: 1px solid #E0E0E0;
            overflow: hidden;
        }
        .day-headers {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border-bottom: 1px solid #E0E0E0;
        }
        .day-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #959595;
        }
        #calendarGrid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        .cal-cell {
            min-height: 110px;
            border-bottom: 1px solid #E0E0E0;
            border-right: 1px solid #E0E0E0;
            padding: 12px;
            cursor: pointer;
        }
        .cal-cell:hover { background: #fafafa; }
        .cal-cell:nth-child(7n) { border-right: none; }
        .day-num {
            font-size: 13px;
            font-weight: 500;
            color: #474747;
            display: inline-block;
        }
        .day-num.other-month { color: #b8b8b8; }
        .day-num.today {
            width: 28px; height: 28px;
            background: #191919; color: #fff;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px;
        }
        .event-badge {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #191919;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.2); z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff; border-radius: 12px; padding: 14px;
            width: 260px; box-shadow: 0 4px 24px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; gap: 6px;
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .modal-title { font-size: 14px; font-weight: 600; color: #191919; }
        .modal-close { background: none; border: none; cursor: pointer; color: #959595; font-size: 18px; line-height: 1; padding: 2px 5px; border-radius: 5px; }
        .modal-close:hover { background: #e8e8e8; }
        .modal-input { width: 100%; border: 1.5px solid #191919; border-radius: 7px; padding: 6px 10px; font-size: 12px; font-family: Inter, sans-serif; color: #191919; outline: none; }
        .modal-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; cursor: pointer; }
        .modal-row:hover { background: #f5f5f5; }
        .modal-time-row { display: flex; align-items: center; gap: 4px; width: 100%; overflow: hidden; }
        .modal-time { display: flex; align-items: center; gap: 4px; padding: 5px 8px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; flex: 1; min-width: 0; overflow: hidden; }
        .modal-time input[type=time] { border: none; outline: none; font-size: 11px; font-family: Inter, sans-serif; color: #191919; background: transparent; width: 100%; min-width: 0; }
        .modal-allday { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #E0E0E0; border-radius: 7px; font-size: 12px; color: #191919; cursor: pointer; }
        .modal-allday input[type=checkbox] { width: 14px; height: 14px; accent-color: #191919; cursor: pointer; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }
        .btn-cancel { padding: 5px 12px; border: 1px solid #E0E0E0; border-radius: 7px; background: #fff; font-size: 12px; font-weight: 500; color: #191919; cursor: pointer; font-family: Inter, sans-serif; }
        .btn-cancel:hover { background: #f5f5f5; }
        .btn-save { padding: 5px 12px; border: none; border-radius: 7px; background: #191919; font-size: 12px; font-weight: 500; color: #fff; cursor: pointer; font-family: Inter, sans-serif; }
        .btn-save:hover { opacity: 0.85; }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside>
        <div class="sidebar-top">
            <div class="sidebar-logo">Mindforge</div>
            <nav>
                <div>
                    <div class="nav-section-title">Overview</div>
                    <a href="index.html" class="nav-link">
                        <img src="assets/icons/home.png" /> Dashboard
                    </a>
                    <a href="tasks.html" class="nav-link">
                        <img src="assets/icons/list.png" /> My Tasks
                    </a>
                </div>
                <div>
                    <div class="nav-section-title">Workspace</div>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Folder.png" /> Projects
                    </a>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Pin.png" /> Events
                    </a>
                    <a href="calendar.html" class="nav-link active">
                        <img src="assets/icons/Date_today.png" /> Calendar
                    </a>
                </div>
                <div>
                    <div class="nav-section-title">Insight</div>
                    <a href="#" class="nav-link">
                        <img src="assets/icons/Frame 4.png" /> Analytics
                    </a>
                </div>
            </nav>
        </div>
        <div>
            <a href="#" class="nav-link">
                <img src="assets/icons/Setting_line.png" /> Settings
            </a>
        </div>
    </aside>

    <main>
        <div class="calendar-content">
            <div class="calendar-header">
                <h1 class="calendar-title" id="calendarTitle"></h1>
                <div class="nav-buttons">
                    <button class="nav-btn" id="prevMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M15 18L9 12L15 6" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <button class="today-btn" id="todayBtn">Today</button>
                    <button class="nav-btn" id="nextMonth">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M9 18L15 12L9 6" stroke="#191919" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="calendar-grid-wrapper">
                <div class="day-headers">
                    <div class="day-header">Sun</div>
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                </div>
                <div id="calendarGrid"></div>
            </div>
        </div>
    </main>

    <!-- New Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">New event</span>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <input type="text" class="modal-input" placeholder="Event name" id="eventName">
            <div class="modal-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="#474747" stroke-width="1.8"/>
                    <path d="M3 10h18" stroke="#474747" stroke-width="1.8"/>
                    <path d="M8 3v4M16 3v4" stroke="#474747" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="modalDateText"></span>
            </div>
            <div class="modal-time-row">
                <div class="modal-time">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="#474747" stroke-width="1.8"/>
                        <path d="M12 7v5l3 3" stroke="#474747" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input type="time" value="09:30">
                </div>
                <span style="color:#474747;">→</span>
                <div class="modal-time">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="#474747" stroke-width="1.8"/>
                        <path d="M12 7v5l3 3" stroke="#474747" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input type="time" value="11:30">
                </div>
            </div>
            <label class="modal-allday">
                <input type="checkbox" id="allDayCheck">
                <span>All day</span>
            </label>
            <div class="modal-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4" stroke="#474747" stroke-width="1.8"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#474747" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span>Add guests</span>
            </div>
            <div class="modal-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M4 6h16M4 10h16M4 14h10" stroke="#474747" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span>Description</span>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelModal">Cancel</button>
                <button class="btn-save" id="saveEvent">Save</button>
            </div>
        </div>
    </div>

    <script>
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const shortMonths = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        const events = {
            "2026-08-03": ["Project Check-in"],
            "2026-08-09": ["Team Sync-up with"],
            "2026-08-12": ["Today"],
            "2026-08-19": ["Client Collaboration"],
        };

        let currentYear = 2026;
        let currentMonth = 7; // August

        function renderCalendar(year, month) {
            document.getElementById("calendarTitle").textContent = `${monthNames[month]}  ${year}`;
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const today = new Date();
            const isCurrentMonth = year === 2026 && month === 7;

            for (let i = 0; i < 42; i++) {
                const cell = document.createElement("div");
                cell.className = "cal-cell";

                let dayNum, isThisMonth = true;
                if (i < firstDay) {
                    dayNum = daysInPrevMonth - firstDay + i + 1;
                    isThisMonth = false;
                } else if (i >= firstDay + daysInMonth) {
                    dayNum = i - firstDay - daysInMonth + 1;
                    isThisMonth = false;
                } else {
                    dayNum = i - firstDay + 1;
                }

                const daySpan = document.createElement("span");
                daySpan.textContent = dayNum;
                daySpan.className = "day-num";

                if (!isThisMonth) {
                    daySpan.classList.add("other-month");
                } else if (isCurrentMonth && dayNum === 12) {
                    daySpan.classList.add("today");
                }

                cell.appendChild(daySpan);

                if (isThisMonth) {
                    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                    if (events[key]) {
                        events[key].forEach(e => {
                            const badge = document.createElement("span");
                            badge.className = "event-badge";
                            badge.textContent = e;
                            cell.appendChild(badge);
                        });
                    }

                    (function(y, m, d) {
                        cell.addEventListener("click", function(e) {
                            const date = new Date(y, m, d);
                            document.getElementById("modalDateText").textContent = dayNames[date.getDay()] + ", " + shortMonths[m] + " " + d;
                            document.getElementById("eventName").value = "";
                            const rect = cell.getBoundingClientRect();
                            const modal = document.querySelector(".modal");
                            const overlay = document.getElementById("eventModal");
                            overlay.classList.add("active");
                            // Position near cell

                        });
                    })(year, month, dayNum);
                }

                grid.appendChild(cell);
            }
        }

        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar(currentYear, currentMonth);
        });
        document.getElementById("todayBtn").addEventListener("click", () => {
            const t = new Date(); currentYear = t.getFullYear(); currentMonth = t.getMonth();
            renderCalendar(currentYear, currentMonth);
        });

        renderCalendar(currentYear, currentMonth);

        // Modal
        function closeModal() {
            document.getElementById("eventModal").classList.remove("active");
        }
        document.getElementById("closeModal").addEventListener("click", closeModal);
        document.getElementById("cancelModal").addEventListener("click", closeModal);
        document.getElementById("eventModal").addEventListener("click", function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape") closeModal();
        });
        document.getElementById("saveEvent").addEventListener("click", function() {
            const name = document.getElementById("eventName").value.trim();
            if (!name) { document.getElementById("eventName").focus(); return; }
            closeModal();
        });
    </script>

</body>
</html>
