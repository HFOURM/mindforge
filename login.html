<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Mindforge</title>
    <link href="./dist/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex flex-col text-gray-900 antialiased font-sans">

    <header class="w-full flex justify-between items-center px-8 py-6">
        <div class="text-xl font-bold">Mindforge</div>
        <div class="text-gray-400">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 20C4 16 8 14 12 14C16 14 20 16 20 20"/>
            </svg>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-4 py-8 min-h-[80vh]">
        <div class="w-full max-w-[340px] flex flex-col items-center text-center">
            <h1 class="text-[28px] font-normal text-gray-900 mb-2 leading-tight">Welcome to Mindforge</h1>
            <p class="text-gray-500 text-[14px] mb-8">Log in to continue:</p>

            <div class="w-full space-y-3 mb-8">
                <!-- Facebook -->
                <button class="relative w-full flex items-center justify-center border border-gray-200 rounded-full py-3 hover:bg-gray-50 transition">
                    <svg class="absolute left-5 w-5 h-5" viewBox="0 0 24 24" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    <span class="text-[14px] font-normal text-gray-700">Facebook</span>
                </button>
                <!-- Apple -->
                <button class="relative w-full flex items-center justify-center border border-gray-200 rounded-full py-3 hover:bg-gray-50 transition">
                    <svg class="absolute left-5 w-5 h-5" viewBox="0 0 24 24" fill="black">
                        <path d="M16.365 1.43c0 1.14-.465 2.19-1.233 2.94-.82.8-2.17 1.42-3.37 1.32-.15-1.11.42-2.27 1.16-3.02.8-.82 2.22-1.4 3.44-1.24zM21.55 17.52c-.56 1.27-.83 1.83-1.54 2.93-.99 1.52-2.39 3.42-4.13 3.44-1.55.02-1.95-1-4.05-.99-2.1.01-2.55 1.01-4.1.97-1.74-.04-3.07-1.76-4.06-3.27-2.76-4.22-3.05-9.18-1.35-11.78 1.2-1.82 3.1-2.88 4.88-2.88 1.8 0 2.93 1 4.4 1 1.42 0 2.28-1 4.38-1 1.56 0 3.21.85 4.41 2.32-3.88 2.13-3.25 7.66.16 9.26z"/>
                    </svg>
                    <span class="text-[14px] font-normal text-gray-700">Apple</span>
                </button>
                <!-- Google -->
                <button class="relative w-full flex items-center justify-center border border-gray-200 rounded-full py-3 hover:bg-gray-50 transition">
                    <svg class="absolute left-5 w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="text-[14px] font-normal text-gray-700">Google</span>
                </button>
                <!-- Use Email -->
                <button onclick="toggleModal(true)" class="relative w-full flex items-center justify-center border border-gray-200 rounded-full py-3 hover:bg-gray-50 transition">
                    <svg class="absolute left-5 w-5 h-5 text-gray-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 7l9 6 9-6"/>
                    </svg>
                    <span class="text-[14px] font-normal text-gray-700">Use Email</span>
                </button>
            </div>

            <p class="text-gray-500 text-[13px] mb-10">
                Don't have an account? <a href="signup.html" class="underline text-gray-900 font-medium">Sign Up Here</a>
            </p>
            <div class="flex gap-2 items-center">
                <div class="w-2.5 h-2.5 rounded-full bg-gray-800"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-gray-200"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-gray-200"></div>
            </div>
        </div>
    </main>

    <footer class="w-full flex justify-center pb-8">
        <div class="flex gap-6 text-[13px] text-gray-400">
            <span>© 2026</span>
            <a href="#" class="hover:text-gray-900 transition">Privacy</a>
            <a href="#" class="hover:text-gray-900 transition">Terms</a>
        </div>
    </footer>

    <!-- Modal Email Login -->
    <div id="emailModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center z-50">
        <div class="bg-white w-11/12 max-w-sm p-8 rounded-[2rem] shadow-2xl relative">
            <button onclick="toggleModal(false)" class="absolute top-5 right-6 text-gray-300 hover:text-gray-600 text-2xl font-light">&times;</button>
            <div class="text-center">
                <h2 class="text-xl font-bold mb-1">Use Email</h2>
                <p class="text-gray-400 mb-6 text-sm">Enter your details to continue:</p>
                <form id="loginForm" class="space-y-3">
                    <input type="email" id="loginEmail" placeholder="Enter Your Email Address"
                        class="w-full px-5 py-3.5 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400" required>
                    <input type="password" id="loginPassword" placeholder="Enter Password"
                        class="w-full px-5 py-3.5 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400" required>
                    <button type="submit" class="w-full bg-black text-white font-semibold py-3.5 rounded-full mt-2 hover:bg-gray-800 transition text-sm">
                        Log In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            const modal = document.getElementById('emailModal');
            modal.classList.toggle('hidden', !show);
            modal.classList.toggle('flex', show);
        }
        document.getElementById('emailModal').addEventListener('click', function(e) {
            if (e.target === this) toggleModal(false);
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('mindforge_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                toggleModal(false);
                alert('Anda berhasil login!');
            } else {
                alert('Email atau password salah!');
            }
        });
    </script>

</body>
</html>
